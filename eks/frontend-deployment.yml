apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: 014498640042.dkr.ecr.eu-north-1.amazonaws.com/website-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_BACKEND_URL
          # value: http://backend-service:5000
          value: http://ae67fe8ada4fc468383177fe913165c0-209953310.eu-north-1.elb.amazonaws.com:500
