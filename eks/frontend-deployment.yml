apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: 014498640042.dkr.ecr.eu-north-1.amazonaws.com/website-frontend:latest
        ports:
        - containerPort: 3000
