apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - image: ${ECR_REGISTRY}/smartovate-website-backend:latest
        name: backend
        ports:
        - containerPort: 5000
        envFrom:
        - secretRef:
            name: app-secrets
