apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - image: 014498640042.dkr.ecr.eu-north-1.amazonaws.com/smartovate-website-backend:latest
        name: backend
        ports:
        - containerPort: 5000
        env:
        - name: POSTGRES_USER
          value: postgres
          # valueFrom:
          #   secretKeyRef:
          #     name: postgres-secret
          #     key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          value: "1234"
          # valueFrom:
          #   secretKeyRef:
          #     name: postgres-secret
          #     key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: dbSubul
          # valueFrom:
          #   secretKeyRef:
          #     name: postgres-secret
          #     key: POSTGRES_DB
        - name: DATABASE_URL
          value: "postgresql://postgres:1234@db-service:5432/dbSubul"
