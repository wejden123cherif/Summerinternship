# Annotations: https://kubernetes-sigs.github.io/aws-load-balancer-controller/v2.7/guide/use_cases/nlb_tls_termination/#:~:text=AWS%20introduced%20TLS%20termination%20for,access%20to%20the%20private%20key.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartovate-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-west-1:309316407602:certificate/169c5c91-9227-457e-a9ac-72779c31a107
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: alb
  rules:
  - host: www.smartovate.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
