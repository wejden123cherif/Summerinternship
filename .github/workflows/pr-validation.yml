name: Pull Request Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-build:
    name: Build frontend container
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --tag smartovate-frontend:pr ./frontend

  backend-build:
    name: Build backend container
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --file backend/dockerfile --tag smartovate-backend:pr ./backend
