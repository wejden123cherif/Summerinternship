name: CICD-smartovateai-website

on:
  push:
    branches:
    - main
    - dev
    - nerminA
  pull_request:
    branches:
    - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-north-1
      ECR_REPOSITORY_FRONTEND: smartovate-website-frontend
      ECR_REPOSITORY_BACKEND: smartovate-website-backend
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::014498640042:role/OIDC
        aws-region: ${{ env.AWS_REGION }}
        role-session-name: GitHubActionsSession
        audience: sts.amazonaws.com

    - name: Verify AWS credentials
      run: aws sts get-caller-identity

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    # - name: Build & push frontend image
    #   env:
    #     ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
    #   run: |
    #     cd frontend
    #     docker build -t smartovate-frontend:latest .
    #     docker tag smartovate-frontend:latest $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest
    #     docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest
    #     cd ..

    # - name: Build & push backend image
    #   env:
    #     ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
    #   run: |
    #     cd backend
    #     docker build -t smartovate-backend:latest .
    #     docker tag smartovate-backend:latest $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest
    #     docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest
    #     cd ..

  deploy:
    name: Deploy to EKS
    needs: build
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-north-1
      EKS_CLUSTER_NAME: smartovatewebsite
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::014498640042:role/OIDC
        aws-region: ${{ env.AWS_REGION }}
        role-session-name: GitHubActionsSession
        audience: sts.amazonaws.com

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}
        kubectl config current-context
        kubectl get nodes

    - name: Apply Fluent Bit cluster info ConfigMap
      run: |
        kubectl apply -f eks/fluent-bit-cluster-info.yml

    - name: Deploy Fluent Bit
      run: |
        kubectl apply -f https://raw.githubusercontent.com/aws-samples/amazon-cloudwatch-container-insights/latest/k8s-deployment-manifest-templates/deployment-mode/daemonset/container-insights-monitoring/cloudwatch-namespace.yaml
        kubectl apply -f https://raw.githubusercontent.com/aws-samples/amazon-cloudwatch-container-insights/latest/k8s-deployment-manifest-templates/deployment-mode/daemonset/container-insights-monitoring/fluent-bit/fluent-bit.yaml

    - name: Create Kubernetes Secrets
      run: |
        kubectl create secret generic postgres-secret \
          --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
          --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
          --from-literal=POSTGRES_DB="${{ secrets.POSTGRES_DB }}" \
          --dry-run=client -o yaml | kubectl apply -f - -n default
        kubectl create secret generic app-secrets \
          --from-literal=DATABASE_URL="postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@db-service:5432/${{ secrets.POSTGRES_DB }}" \
          --from-literal=AWS_DEFAULT_REGION="${{ env.AWS_REGION }}" \
          --from-literal=S3_BUCKET_NAME="${{ secrets.S3_BUCKET_NAME }}" \
          --dry-run=client -o yaml | kubectl apply -f - -n default

    - name: Deploy database to EKS
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        kubectl apply -f eks/db-deployment.yml 
        kubectl apply -f eks/db-service.yml
        kubectl rollout status deployment/postgres --timeout=300s

    - name: Deploy backend to EKS
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        envsubst < eks/backend-deployment.yml | kubectl apply --validate=false -f -        
        kubectl apply -f eks/backend-service.yml
        kubectl rollout status deployment/backend
    # - name: Deploy frontend to EKS
    #   env:
    #     ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
    #   run: |
    #     envsubst < eks/frontend-deployment.yml | kubectl apply -f - -n default
    #     kubectl apply -f eks/frontend-service.yml -n default
    #     kubectl rollout status deployment/frontend -n default

  test:
    name: Verify Deployment
    needs: deploy
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-north-1
      EKS_CLUSTER_NAME: smartovatewebsite
    steps:
    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::014498640042:role/OIDC
        aws-region: ${{ env.AWS_REGION }}
        role-session-name: GitHubActionsSession
        audience: sts.amazonaws.com

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}
        kubectl config current-context

    - name: Verify pods and services
      run: |
        kubectl get pods -o wide
        kubectl get services -o wide
        echo "Frontend URL: http://$(kubectl get svc frontend-service -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
        echo "Backend URL: http://$(kubectl get svc backend-service -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
        kubectl describe pods -l app=postgres
        kubectl logs -l app=postgres
