name: CICD-smartovateai-website

on:
  push:
    branches:
    - main
    - dev
    - nerminA
  pull_request:
    branches:
    - main

permissions:
  id-token: write
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      uses: actions/checkout@v2

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v3
      with:
        role-to-assume: arn:aws:iam::014498640042:role/OIDC
        aws-region: eu-north-1
        role-session-name: GitHubActionsSession
        audience: sts.amazonaws.com

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    # - name: Build & tag frontend
    #   env:
    #     ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
    #     ECR_REPOSITORY_FRONTEND: smartovate-website-frontend
    #   run: |
    #     echo "ECR Registry: $ECR_REGISTRY"
    #     cd frontend
    #     docker build -t smartovate-frontend:latest .
    #     docker tag smartovate-frontend:latest $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest
    #     docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest
    #     cd ..

    - name: test aws connection
      run: |
        aws sts get-caller-identity

    - name: build & tag backend
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY_BACKEND: smartovate-website-backend
      run: |
        cd backend
        docker build -t smartovate-backend:latest .
        docker tag smartovate-backend:latest 014498640042.dkr.ecr.eu-north-1.amazonaws.com/smartovate-website-backend:latest
        docker push 014498640042.dkr.ecr.eu-north-1.amazonaws.com/smartovate-website-backend:latest
    - name: list ecr images
      run: aws ecr list-images --repository-name smartovate-website-backend --query 'imageIds[*].imageTag' --output text
