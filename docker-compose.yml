name: smartovateai-website

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: test_front_smartovate
    environment:
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=your_publishable_key_here 
    ports: 
      - "8000:3000"
    depends_on:
      - backend
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    image: test_back_smartovate
    ports: 
      - "5000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MAIL_PORT=587
      - STRIPE_PUBLISHABLE_KEY=your_publishable_key_here
    depends_on:
      - db  
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    